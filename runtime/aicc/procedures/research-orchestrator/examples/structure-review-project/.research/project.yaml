schema_version: 1
project_id: structure-review-example
title: Structure model review example
mode: semi-automatic
created_at: "2026-06-25T00:00:00+08:00"
objective: >
  Demonstrate a multi-agent structure modeling gate where literature precedent and
  geometry audit are reviewed before downstream engine input generation.
success_criteria:
  - surface-literature review is accepted before structure criticism
  - candidate structures are generated by structure-prep
  - structure critic is ready and cannot edit coordinates or submit jobs
default_policy:
  approval_required_for:
    - scientific_model_choice
    - expensive_hpc_submission
    - promote_claim_to_report
