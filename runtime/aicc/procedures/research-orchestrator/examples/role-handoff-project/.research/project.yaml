schema_version: 1
project_id: role-handoff-example
title: Role handoff example for critic-gated reporting
mode: semi-automatic
created_at: "2026-06-25T00:00:00+08:00"
objective: >
  Demonstrate role contracts, evidence packets, single-owner execution, critic review,
  and report blocking until a scientific claim is accepted.
success_criteria:
  - method and observable assumptions are accepted before execution
  - execution is owned by one engine-runner task
  - critic receives a complete evidence packet
  - report drafting waits for an accepted scientific claim
default_policy:
  approval_required_for:
    - scientific_model_choice
    - expensive_hpc_submission
    - promote_claim_to_report
