schema_version: 1
id: T001
title: Audit model adequacy before engine submission
role: structure-critic
role_contract: procedures/research-orchestrator/references/roles.md#structure-critic
skill: structure-prep
status: accepted
depends_on: []
approval: none
inputs: []
