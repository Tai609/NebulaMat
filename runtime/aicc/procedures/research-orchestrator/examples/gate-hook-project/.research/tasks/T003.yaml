schema_version: 1
id: T003
title: Critique validated result and classify claim
role: scientific-critic
role_contract: procedures/research-orchestrator/references/roles.md#scientific-critic
skill: comp-chem-workflow
status: accepted
depends_on: []
approval: none
inputs: []
can_read:
  - artifact_type: parser-result
can_write:
  - artifact_type: gate-verdict
  - artifact_type: scientific-claim
