release_gates:
  - result_gate
execution_policy:
  mode: single_owner
  allow_parallel_subagents: true
assumptions:
  - Fixture claim is illustrative and not a scientific result.
provenance:
  - work/reviews/result_gate.yaml
  - work/claims/claim.md
